---
# Runs on the server (as the cPanel user) when a deployment is triggered on
# the checked-out `deploy` branch — via cPanel's Git Version Control.
# No SSH needed: cPanel's deployment system executes these itself.
deployment:
  tasks:
    - export DEPLOYPATH=/home/alifarif/resume-builder-app
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/rm -rf $DEPLOYPATH/.next
    - /bin/cp -R .next server.js package.json package-lock.json next.config.ts $DEPLOYPATH/
    - source /home/alifarif/nodevenv/resume-builder-app/22/bin/activate && cd $DEPLOYPATH && npm install --omit=dev
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
