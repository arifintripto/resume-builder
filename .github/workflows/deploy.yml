name: Deploy

on:
  push:
    branches: [main]

# The host blocks FTP data channels and SSH, so deploys go through cPanel
# itself: build here, publish artifacts to a `deploy` branch, then tell
# cPanel (HTTPS API, port 2083) to pull that branch and run .cpanel.yml —
# which copies files, npm-installs, and restarts Passenger on the server.

permissions:
  contents: write

env:
  CPANEL_HOST: server16.webhostbd.net
  CPANEL_USER: alifarif
  REPO_ROOT: /home/alifarif/repositories/resume-builder

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with subpath
        env:
          BASE_PATH: /resume-builder
        run: npm run build

      - name: Assemble deploy-branch content
        run: |
          rm -rf .next/cache deploy
          mkdir -p deploy
          cp -r .next server.js package.json package-lock.json next.config.ts .cpanel.yml deploy/

      - name: Publish deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Build from ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy

      - name: Trigger cPanel pull + deployment
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          if [ -z "$CPANEL_TOKEN" ]; then
            echo "CPANEL_TOKEN secret not set — deploy branch published, server not triggered."
            exit 0
          fi
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          ROOT_ENC=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${REPO_ROOT}', safe=''))")

          echo "Pulling deploy branch on the server..."
          curl -sS -H "$AUTH" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update?repository_root=${ROOT_ENC}&branch=deploy" \
            -o update.json
          cat update.json
          python3 -c "import json; d=json.load(open('update.json')); raise SystemExit(0 if d.get('status')==1 else 1)" \
            || { echo '::error::cPanel pull failed'; exit 1; }

          echo "Running .cpanel.yml deployment tasks..."
          curl -sS -H "$AUTH" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeploy/create?repository_root=${ROOT_ENC}" \
            -o deploy.json
          cat deploy.json
          python3 -c "import json; d=json.load(open('deploy.json')); raise SystemExit(0 if d.get('status')==1 else 1)" \
            || { echo '::error::cPanel deployment failed'; exit 1; }

          echo "Server deployment triggered successfully."
