name: Deploy

on:
  push:
    branches: [main]

# This host blocks SSH, FTP data channels, AND outbound git — the only proven
# channel is cPanel's own HTTPS API on port 2083. So: build everything on the
# runner (including production node_modules — same Linux/Node 22 as the
# server), upload one tarball via the File Manager API, extract it server-side,
# and touch tmp/restart.txt so Passenger restarts. No git/npm/shell on the host.

env:
  CPANEL_HOST: server16.webhostbd.net
  CPANEL_USER: alifarif
  APP_DIR: resume-builder-app
  APP_PATH: /home/alifarif/resume-builder-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with subpath
        env:
          BASE_PATH: /resume-builder
        run: npm run build

      - name: Assemble runtime bundle
        run: |
          rm -rf .next/cache
          npm prune --omit=dev
          mkdir -p bundle
          cp -r .next node_modules server.js package.json package-lock.json next.config.ts bundle/
          tar -czf build.tar.gz -C bundle .
          ls -lh build.tar.gz

      - name: Deploy via cPanel API
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          BASE="https://${CPANEL_HOST}:2083"
          enc() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"; }
          check() { python3 -c "
          import json,sys
          d=json.load(open(sys.argv[1]))
          ok = d.get('status')==1 if 'status' in d else not d.get('cpanelresult',{}).get('error')
          sys.exit(0 if ok else 1)
          " "$1"; }

          echo "1/5 Uploading bundle ($(du -h build.tar.gz | cut -f1))..."
          curl -sS -H "$AUTH" -F "dir=${APP_DIR}" -F "file-1=@build.tar.gz" \
            "${BASE}/execute/Fileman/upload_files" -o step.json
          cat step.json; check step.json || { echo '::error::upload failed'; exit 1; }

          echo "2/5 Removing old .next..."
          curl -sS -H "$AUTH" \
            "${BASE}/json-api/cpanel?cpanel_jsonapi_user=${CPANEL_USER}&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=unlink&sourcefiles=$(enc ${APP_PATH}/.next)" \
            -o step.json
          cat step.json  # non-fatal: .next may not exist on first deploy

          echo "3/5 Extracting bundle..."
          curl -sS -H "$AUTH" \
            "${BASE}/json-api/cpanel?cpanel_jsonapi_user=${CPANEL_USER}&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=$(enc ${APP_PATH}/build.tar.gz)&destfiles=$(enc ${APP_PATH})" \
            -o step.json
          cat step.json; check step.json || { echo '::error::extract failed'; exit 1; }

          echo "4/5 Deleting bundle archive..."
          curl -sS -H "$AUTH" \
            "${BASE}/json-api/cpanel?cpanel_jsonapi_user=${CPANEL_USER}&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=unlink&sourcefiles=$(enc ${APP_PATH}/build.tar.gz)" \
            -o step.json
          cat step.json

          echo "5/5 Touching tmp/restart.txt (Passenger restart)..."
          curl -sS -H "$AUTH" \
            "${BASE}/json-api/cpanel?cpanel_jsonapi_user=${CPANEL_USER}&cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=mkdir&path=$(enc ${APP_DIR})&name=tmp" \
            -o step.json  # non-fatal: may already exist
          curl -sS -H "$AUTH" \
            --data-urlencode "dir=${APP_DIR}/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=deployed $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA:0:7}" \
            "${BASE}/execute/Fileman/save_file_content" -o step.json
          cat step.json; check step.json || { echo '::error::restart touch failed'; exit 1; }

          echo "Deploy complete."
